# =============================================================================
#  Salesfam API contract — COPY
# =============================================================================
#  ⚠️  Do NOT edit this file here to design the API.
#
#  The source of truth lives in the BACKEND repo. The agreed flow is:
#
#     front + back meeting  ->  back opens a draft PR with the contract
#                           ->  front COPIES that YAML into this file
#                           ->  both teams build against it
#
#  When pulling in a new version from the backend:
#    1. Replace this file with the one from the draft PR (keep this header)
#    2. npm run api:lint    -> validates the contract is well-formed
#    3. npm run api:types   -> regenerates lib/api/schema.d.ts
#    4. Commit BOTH files together (CI checks they do not drift apart)
#
#  If you need an API change, ask the backend team. Editing it here by hand
#  makes the frontend compile against something the server does not serve.
#
#  Full guide in openapi/README.md
# =============================================================================

openapi: 3.1.0

info:
  title: Salesfam API
  version: 0.1.0
  summary: Contract for the API consumed by the Salesfam frontend.
  description: |
    This document is the agreement between frontend and backend. Every endpoint
    described here generates TypeScript types that the frontend is required to
    use: if the contract changes, compilation fails at every point in the code
    that relied on the previous version.
  license:
    name: Proprietary — Salesfam internal use
    identifier: LicenseRef-Salesfam-Proprietary

servers:
  - url: http://localhost:8000
    description: Local backend
  - url: https://api.salesfam.com
    description: Production (replace with the real backend URL)

tags:
  - name: System
    description: Diagnostic and service status endpoints.

# Default security for the WHOLE API. Every endpoint inherits it unless it
# overrides it. Adjust the scheme to whatever the backend actually uses.
security:
  - bearerAuth: []

# -----------------------------------------------------------------------------
#  ENDPOINTS
# -----------------------------------------------------------------------------
#  /health is a working example proving the whole chain is alive (types +
#  client + docs viewer). Delete it as soon as you have real endpoints.
# -----------------------------------------------------------------------------
paths:
  /health:
    get:
      operationId: getHealth
      summary: Service status
      description: Returns the backend's operational status and deployed version.
      tags:
        - System
      # `security: []` overrides the global security: this endpoint is public.
      security: []
      responses:
        "200":
          description: The service is operational.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "429":
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

# -----------------------------------------------------------------------------
#  REUSABLE SCHEMAS
# -----------------------------------------------------------------------------
#  Anything repeated across endpoints lives here and is referenced with $ref.
#  Each entry under components/schemas becomes a TypeScript type.
# -----------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT token in the `Authorization: Bearer <token>` header."

  schemas:
    HealthStatus:
      type: object
      description: Snapshot of the backend's status.
      required:
        - status
        - version
      properties:
        status:
          type: string
          description: Current operational status.
          enum:
            - ok
            - degraded
        version:
          type: string
          description: Deployed backend version.
          examples:
            - 0.1.0

    Error:
      type: object
      description: Standard shape for every API error.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable error identifier, safe to branch business logic on.
          examples:
            - service_unavailable
        message:
          type: string
          description: Human-readable error description, safe to display or log.
          examples:
            - The service is temporarily unavailable.
