name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint & format check
        run: npm run lint:ci

      # Validates the OpenAPI contract and checks that lib/api/schema.d.ts is
      # regenerated. If someone touches openapi.yaml without running
      # `npm run api:types`, the git diff fails here.
      - name: API contract
        run: npm run api:check

      # Build runs before the type check: Next generates the global types
      # (LayoutProps, PageProps...) used by app/layout.tsx into .next/types.
      # Without that step first, `tsc --noEmit` fails on a clean clone.
      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit
